[project]
name = "shortsgen"
version = "0.1.0"
description = "Gerador automatico de shorts/clipes verticais a partir de videos do YouTube, com IA para achar highlights, reenquadrar e legendar."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "google-genai>=1.0.0",
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
    "ffmpeg-python>=0.2.0",
    "rich>=13.9",
    "textual>=8.2.8",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
shortsgen = "shortsgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortsgen"]

[tool.uv]
# O antivirus desta maquina bloqueia o launcher Python que o uv baixaria por conta
# propria (nao assinado). Forcamos o uso do Python ja instalado no sistema.
python-preference = "only-system"
